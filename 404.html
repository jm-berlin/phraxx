<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fraxx – neue Adresse</title>
<link rel="canonical" href="https://jm-berlin.github.io/fraxx/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e5e2e0;color:#141212;font-family:Urbanist,Inter,system-ui,sans-serif;padding:20px;box-sizing:border-box}
.bx{background:#f3f1ef;border-radius:24px;box-shadow:0 8px 32px rgb(40 30 25 / .12);padding:32px 28px;max-width:460px;text-align:center}
h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}
p{color:#6b635d;line-height:1.5;margin:0 0 18px}
a.b{display:inline-block;background:#141212;color:#f3f1ef;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 22px}
</style>
</head>
<body>
<div class="bx">
  <h1>Phraxx heißt jetzt Fraxx</h1>
  <p id="t">Die App ist umgezogen. Du wirst gleich weitergeleitet.</p>
  <a class="b" id="go" href="https://jm-berlin.github.io/fraxx/">Zu Fraxx →</a>
</div>
<script>
(function(){
  // Alte Adresse /phraxx/… → /fraxx/… (Pfad, Suche und Anker bleiben erhalten)
  var rest = location.pathname.replace(/^\/phraxx\/?/, "");
  var url = "https://jm-berlin.github.io/fraxx/" + rest + location.search + location.hash;
  document.getElementById("go").href = url;
  var app = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (app) {
    // Installierte App: Hinweis zum Neuinstallieren statt stiller Weiterleitung
    document.getElementById("t").textContent = "Die App hat eine neue Adresse. Öffne Fraxx und installiere es dort neu, dann kannst du diese App löschen. Deine Einträge bleiben erhalten.";
  } else {
    setTimeout(function(){ location.replace(url); }, 1200);
  }
})();
</script>
</body>
</html>
